name: DeepSWE regrade

# Replays rollouts DeepSWE already published. Each selected rollout's recorded
# `model.patch` is applied in the task environment and graded by the benchmark's
# own verifier, on a GitHub-hosted runner. Published reward vs. ours is the
# measurement: agreement means the benchmark travels off Datacurve's
# infrastructure, disagreement is a reproduction difference.

on:
  workflow_dispatch:
    inputs:
      n_trials:
        description: "How many rollouts to regrade"
        type: string
        default: "10"
      trials:
        description: "Explicit rollout names (space/comma separated); bypasses sampling"
        type: string
        default: ""
      attempts:
        description: "Replays per rollout (>1 measures verifier flakiness)"
        type: string
        default: "1"
      models:
        description: "Model globs (empty = any)"
        type: string
        default: ""
      tasks:
        description: "Task globs (empty = any)"
        type: string
        default: ""
      outcome:
        description: "Restrict to rollouts published as..."
        type: choice
        options: ["any", "pass", "fail"]
        default: "any"
      balance:
        description: "Half published-pass, half published-fail"
        type: boolean
        default: true
      seed:
        description: "Selection seed"
        type: string
        default: "0"
      shards:
        description: "Parallel runners"
        type: string
        default: "5"
      release:
        description: "DeepSWE data release"
        type: string
        default: "v1.1"
      deepswe_ref:
        description: "datacurve-ai/deep-swe ref"
        type: string
        default: "0b9fabbb63b9104d678fe965e1632f2dd9eaa2ea"
      pier_version:
        description: "datacurve-pier version"
        type: string
        default: "0.3.1"
      concurrency:
        description: "Trials to run at once per runner (2 fits a 4-vCPU runner)"
        type: string
        default: "1"
      task_timeout:
        description: "Hard per-rollout timeout (seconds)"
        type: string
        default: "3600"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      n_selected: ${{ steps.select.outputs.n_selected }}
    steps:
      - uses: actions/checkout@v4

      - id: select
        run: |
          python3 scripts/select_trials.py \
            --release "${{ inputs.release }}" \
            --trial-names "${{ inputs.trials }}" \
            --models "${{ inputs.models }}" \
            --tasks "${{ inputs.tasks }}" \
            --outcome "${{ inputs.outcome }}" \
            --n-trials "${{ inputs.n_trials }}" \
            --seed "${{ inputs.seed }}" \
            --shards "${{ inputs.shards }}" \
            ${{ inputs.balance && '--balance' || '' }} \
            --out trial-plan.json

      - uses: actions/upload-artifact@v4
        with:
          name: trial-plan
          path: trial-plan.json

  regrade:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Check out the benchmark
        uses: actions/checkout@v4
        with:
          repository: datacurve-ai/deep-swe
          ref: ${{ inputs.deepswe_ref }}
          path: deep-swe

      - uses: actions/download-artifact@v4
        with:
          name: trial-plan
          path: .

      - name: Install pier
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin pier version
        run: |
          uv tool install "datacurve-pier==${{ inputs.pier_version }}"
          pier --version

      - name: Regrade shard ${{ matrix.shard }}
        env:
          TRIALS: ${{ matrix.trials }}
          PLAN: trial-plan.json
          TASK_TIMEOUT: ${{ inputs.task_timeout }}
          ATTEMPTS: ${{ inputs.attempts }}
          CONCURRENCY: ${{ inputs.concurrency }}
          STAGGER_MAX_SEC: "45"
        run: bash scripts/run_trials_shard.sh

      - name: Collect results
        if: always()
        run: |
          find jobs -maxdepth 3 | head -50 || true
          python3 scripts/collect.py \
            --jobs-dir jobs \
            --status out/status.jsonl \
            --shard "${{ matrix.shard }}" \
            --runner "${{ runner.name }}" \
            --agent patch-replay \
            --out results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-shard-${{ matrix.shard }}
          path: |
            results
            out/*.log
            out/shard.tsv
          retention-days: 30

  report:
    needs: [plan, regrade]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: trial-plan
          path: .

      - uses: actions/download-artifact@v4
        with:
          pattern: results-shard-*
          merge-multiple: true
          path: shards

      - name: Build metadata
        run: |
          cat > meta.json <<EOF
          {
            "release": "${{ inputs.release }}",
            "n_selected": "${{ needs.plan.outputs.n_selected }}",
            "models": "${{ inputs.models }}",
            "tasks": "${{ inputs.tasks }}",
            "outcome_filter": "${{ inputs.outcome }}",
            "balanced": "${{ inputs.balance }}",
            "seed": "${{ inputs.seed }}",
            "deepswe_ref": "${{ inputs.deepswe_ref }}",
            "pier_version": "${{ inputs.pier_version }}",
            "runner_image": "ubuntu-latest",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Aggregate
        run: |
          python3 scripts/aggregate_trials.py \
            --results-dir shards \
            --plan trial-plan.json \
            --meta meta.json \
            --out report
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report
          retention-days: 90
