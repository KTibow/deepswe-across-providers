name: DeepSWE replay

# Replays DeepSWE tasks inside GitHub-hosted runners using pier's non-model
# agents: `oracle` (runs each task's reference solve.sh, then grades it with the
# held-out verifier) and `nop` (submits nothing). Both have a known-correct
# answer, so the run is a pure reproduction check of the benchmark's
# environments and verifiers — no API keys, no model calls.

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Explicit task ids or globs (space/comma separated). Overrides sampling."
        type: string
        default: ""
      n_tasks:
        description: "Sample this many tasks (0 = all 113)"
        type: string
        default: "5"
      seed:
        description: "Sampling seed"
        type: string
        default: "0"
      shards:
        description: "Parallel runners"
        type: string
        default: "5"
      attempts:
        description: "Repeats per task (>1 measures flakiness)"
        type: string
        default: "1"
      agent:
        description: "Replay agent"
        type: choice
        options: ["oracle", "nop"]
        default: "oracle"
      deepswe_ref:
        description: "datacurve-ai/deep-swe ref"
        type: string
        default: "0b9fabbb63b9104d678fe965e1632f2dd9eaa2ea"
      pier_version:
        description: "datacurve-pier version"
        type: string
        default: "0.3.1"
      task_timeout:
        description: "Hard per-task timeout (seconds)"
        type: string
        default: "3600"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      n_selected: ${{ steps.plan.outputs.n_selected }}
      mode: ${{ steps.plan.outputs.mode }}
      deepswe_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the benchmark
        uses: actions/checkout@v4
        with:
          repository: datacurve-ai/deep-swe
          ref: ${{ inputs.deepswe_ref }}
          path: deep-swe

      - id: sha
        run: echo "sha=$(git -C deep-swe rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: plan
        run: |
          python3 scripts/plan.py \
            --tasks-dir deep-swe/tasks \
            --tasks "${{ inputs.tasks }}" \
            --n-tasks "${{ inputs.n_tasks }}" \
            --seed "${{ inputs.seed }}" \
            --shards "${{ inputs.shards }}" \
            --out plan.json

      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  replay:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Check out the benchmark
        uses: actions/checkout@v4
        with:
          repository: datacurve-ai/deep-swe
          ref: ${{ inputs.deepswe_ref }}
          path: deep-swe

      - name: Install pier
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin pier version
        run: |
          uv tool install "datacurve-pier==${{ inputs.pier_version }}"
          pier --version
          docker --version
          docker compose version

      - name: Replay shard ${{ matrix.shard }}
        env:
          TASKS: ${{ matrix.tasks }}
          AGENT: ${{ inputs.agent }}
          ATTEMPTS: ${{ inputs.attempts }}
          TASK_TIMEOUT: ${{ inputs.task_timeout }}
          STAGGER_MAX_SEC: "45"
        run: bash scripts/run_shard.sh

      - name: Collect results
        if: always()
        run: |
          find jobs -maxdepth 3 | head -50 || true
          python3 scripts/collect.py \
            --jobs-dir jobs \
            --status out/status.jsonl \
            --shard "${{ matrix.shard }}" \
            --runner "${{ runner.name }}" \
            --agent "${{ inputs.agent }}" \
            --out results

      - name: Disk report
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-shard-${{ matrix.shard }}
          path: |
            results
            out/*.log
          retention-days: 30

  report:
    needs: [plan, replay]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the benchmark
        uses: actions/checkout@v4
        with:
          repository: datacurve-ai/deep-swe
          ref: ${{ inputs.deepswe_ref }}
          path: deep-swe

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: .

      - uses: actions/download-artifact@v4
        with:
          pattern: results-shard-*
          merge-multiple: true
          path: shards

      - name: Build metadata
        run: |
          cat > meta.json <<EOF
          {
            "agent": "${{ inputs.agent }}",
            "selection": "${{ needs.plan.outputs.mode }}",
            "tasks_requested": "${{ inputs.tasks }}",
            "n_selected": "${{ needs.plan.outputs.n_selected }}",
            "attempts_per_task": "${{ inputs.attempts }}",
            "deepswe_ref": "${{ inputs.deepswe_ref }}",
            "deepswe_sha": "${{ needs.plan.outputs.deepswe_sha }}",
            "pier_version": "${{ inputs.pier_version }}",
            "runner_image": "ubuntu-latest",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          cat meta.json

      - name: Aggregate
        run: |
          python3 scripts/aggregate.py \
            --results-dir shards \
            --plan plan.json \
            --manifest deep-swe/tasks/manifest.json \
            --agent "${{ inputs.agent }}" \
            --meta meta.json \
            --out report
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report
          retention-days: 90
